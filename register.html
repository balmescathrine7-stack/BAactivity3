<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoCoins | Register</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-page">

<div class="container-fluid">

    <div class="row min-vh-100">

        <!-- BACKGROUND IMAGE -->
        <div class="col-lg-5 auth-image d-none d-lg-flex">

            <div>

                <h1 class="display-5 fw-bold text-white">
                    Join EcoCoins
                </h1>

                <p class="text-white">
                    Start recycling and earn EcoPoints
                    in your barangay.
                </p>

            </div>

        </div>


        <!-- REGISTRATION -->
        <div class="col-lg-7 d-flex align-items-center justify-content-center py-5">

            <div class="auth-form">

                <div class="text-center mb-4">

                    <a href="index.html"
                       class="text-success text-decoration-none">

                        <h2 class="fw-bold">
                            <i class="bi bi-recycle"></i>
                            EcoCoins
                        </h2>

                    </a>

                    <p class="text-secondary">
                        Create your resident account
                    </p>

                </div>


                <form>

                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                placeholder="Enter full name"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Contact Number
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                placeholder="09XXXXXXXXX"
                                required
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter email"
                            required
                        >

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            class="form-control"
                            rows="2"
                            placeholder="Enter your barangay address"
                            required
                        ></textarea>

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Create password"
                                required
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                class="form-control"
                                placeholder="Confirm password"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-check mb-4">

                        <input
                            class="form-check-input"
                            type="checkbox"
                            id="terms"
                            required
                        >

                        <label class="form-check-label"
                               for="terms">

                            I agree to the
                            <a href="#" class="text-success">
                                Terms and Conditions
                            </a>

                        </label>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-success btn-lg w-100">

                        Create Account

                    </button>

                </form>


                <p class="text-center mt-4">

                    Already have an account?

                    <a href="login.html"
                       class="text-success fw-semibold">
                        Login
                    </a>

                </p>


                <div class="text-center">

                    <a href="index.html"
                       class="text-secondary text-decoration-none">

                        <i class="bi bi-arrow-left"></i>
                        Back to Home

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
